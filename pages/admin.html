<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FarmLedger — Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<header class="topbar">
  <a href="#" class="logo">
    <div class="logo-icon">🌾</div>
    <div><div class="logo-text">FarmLedger</div><div class="logo-sub">Admin Panel</div></div>
  </a>
  <button class="menu-toggle" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
  <nav class="nav" id="mainNav">
    <a href="#" class="active nav-link" data-tab="overview"><span class="nav-icon">📊</span> Overview</a>
    <a href="#" class="nav-link" data-tab="landlords"><span class="nav-icon">👑</span> Landlords</a>
    <a href="#" class="nav-link" data-tab="users"><span class="nav-icon">👥</span> All Users</a>
  </nav>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" id="adminAvatar">A</div>
      <div class="user-info">
        <div class="user-name" id="adminName">Admin</div>
        <div class="user-role"><span class="role-badge role-admin">Admin</span></div>
      </div>
    </div>
    <button class="btn-ghost" id="logoutBtn">🚪 Logout</button>
  </div>
</header>

<main class="container">
  <div id="loadingState" class="loading"><div class="spinner"></div></div>
  <div id="appContent" class="hidden">

    <div id="tab-overview">
      <div class="page-header">
        <div>
          <div class="page-title"><span>📊</span> Admin Overview</div>
          <div class="page-subtitle">Platform statistics and management</div>
        </div>
        <button class="btn" onclick="openModal('createLandlordModal')">➕ Create Landlord</button>
      </div>
      <div class="stats-grid" id="adminStats"></div>
      <div class="card">
        <div class="card-title"><span>👑</span> Landlords</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Created</th></tr></thead>
            <tbody id="landlordsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-landlords" class="hidden">
      <div class="page-header">
        <div><div class="page-title"><span>👑</span> Landlords</div></div>
        <button class="btn" onclick="openModal('createLandlordModal')">➕ Add Landlord</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Created</th></tr></thead>
            <tbody id="landlordsBody2"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-users" class="hidden">
      <div class="page-header"><div class="page-title"><span>👥</span> All Users</div></div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Email</th><th>Created</th></tr></thead>
            <tbody id="allUsersBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</main>

<div class="modal-overlay" id="createLandlordModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">👑 Create Landlord</div>
      <button class="modal-close" onclick="closeModal('createLandlordModal')">✕</button>
    </div>
    <div class="form-group"><label class="form-label">👤 Full Name *</label><input id="ll_name" placeholder="Muhammad Ahmed"/></div>
    <div class="form-group"><label class="form-label">📧 Email *</label><input type="email" id="ll_email" placeholder="ahmed@email.com"/></div>
    <div class="form-group"><label class="form-label">🔑 Password *</label><input type="password" id="ll_password" placeholder="Min 6 characters"/></div>
    <div class="form-group"><label class="form-label">📞 Phone</label><input id="ll_phone" placeholder="03001234567"/></div>
    <div id="llError" class="hidden" style="background:var(--danger-light);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px"></div>
    <button class="btn btn-full" id="llBtn" onclick="createLandlord()">✅ Create Account</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, collection, getDocs, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyDpTPibk-7_kqyJdfN94KrLlcKkoNnqIYE",
    authDomain: "farmledger-e85e3.firebaseapp.com",
    projectId: "farmledger-e85e3",
    storageBucket: "farmledger-e85e3.firebasestorage.app",
    messagingSenderId: "922324809308",
    appId: "1:922324809308:web:05c015ce12e55034e99899"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);

  function fmt(n) { return '₨ ' + Number(n||0).toLocaleString('en-PK'); }
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    setTimeout(()=>t.classList.remove('show'), 3500);
  }
  window.openModal = id => document.getElementById(id).classList.add('open');
  window.closeModal = id => document.getElementById(id).classList.remove('open');
  document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));

  let currentUser = null;

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = '../index.html'; return; }
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists() || snap.data().role !== 'admin') { window.location.href = '../index.html'; return; }
      currentUser = { uid: user.uid, ...snap.data() };
      document.getElementById('adminName').textContent = currentUser.name || 'Admin';
      document.getElementById('adminAvatar').textContent = (currentUser.name||'A').charAt(0).toUpperCase();
      await loadData();
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');
    } catch(e) {
      console.error(e);
      document.getElementById('loadingState').innerHTML = '<p style="color:red;padding:20px">Error: ' + e.message + '</p>';
    }
  });

  async function loadData() {
    const snap = await getDocs(collection(db, 'users'));
    const users = snap.docs.map(d => ({uid: d.id, ...d.data()}));
    const landlords = users.filter(u => u.role === 'landlord');
    const managers  = users.filter(u => u.role === 'manager');
    const farmers   = users.filter(u => u.role === 'farmer');

    document.getElementById('adminStats').innerHTML = `
      <div class="stat-card"><div class="stat-card-inner"><div class="stat-icon-wrap stat-icon-gold">👑</div><div><div class="stat-label">Landlords</div><div class="stat-value">${landlords.length}</div></div></div></div>
      <div class="stat-card"><div class="stat-card-inner"><div class="stat-icon-wrap stat-icon-blue">👨‍💼</div><div><div class="stat-label">Managers</div><div class="stat-value">${managers.length}</div></div></div></div>
      <div class="stat-card"><div class="stat-card-inner"><div class="stat-icon-wrap stat-icon-green">👨‍🌾</div><div><div class="stat-label">Farmers</div><div class="stat-value">${farmers.length}</div></div></div></div>
      <div class="stat-card"><div class="stat-card-inner"><div class="stat-icon-wrap stat-icon-orange">👥</div><div><div class="stat-label">Total Users</div><div class="stat-value">${users.length}</div></div></div></div>`;

    const llRows = landlords.length === 0
      ? '<tr><td colspan="5" style="text-align:center;padding:20px;color:#999">No landlords yet</td></tr>'
      : landlords.map(l=>`<tr><td><span class="badge badge-gold">${l.userId||'—'}</span></td><td><strong>${l.name}</strong></td><td>${l.email||'—'}</td><td>${l.phone||'—'}</td><td>${l.createdAt?.toDate?.().toLocaleDateString()||'—'}</td></tr>`).join('');
    document.getElementById('landlordsBody').innerHTML = llRows;
    document.getElementById('landlordsBody2').innerHTML = llRows;

    document.getElementById('allUsersBody').innerHTML = users.map(u=>`
      <tr><td><span class="badge badge-green">${u.userId||'—'}</span></td><td><strong>${u.name}</strong></td>
      <td><span class="badge badge-blue">${u.role}</span></td><td>${u.email||'—'}</td>
      <td>${u.createdAt?.toDate?.().toLocaleDateString()||'—'}</td></tr>`).join('');
  }

  window.createLandlord = async function() {
    const name = document.getElementById('ll_name').value.trim();
    const email = document.getElementById('ll_email').value.trim();
    const pass = document.getElementById('ll_password').value.trim();
    const phone = document.getElementById('ll_phone').value.trim();
    const err = document.getElementById('llError');
    const btn = document.getElementById('llBtn');
    err.classList.add('hidden');
    if (!name||!email||!pass) { err.textContent='⚠️ Name, email and password required'; err.classList.remove('hidden'); return; }
    if (pass.length<6) { err.textContent='⚠️ Password min 6 characters'; err.classList.remove('hidden'); return; }
    btn.textContent='⏳ Creating...'; btn.disabled=true;
    try {
      const counterRef = doc(db,'counters','landlords');
      let userId;
      await runTransaction(db, async tx => {
        const s = await tx.get(counterRef);
        const count = s.exists()?(s.data().count||0)+1:1;
        tx.set(counterRef,{count});
        userId = `LND-${String(count).padStart(3,'0')}`;
      });
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db,'users',cred.user.uid), {
        uid: cred.user.uid, userId, name, email, phone, role:'landlord',
        createdBy: currentUser.uid, status:'active', createdAt: serverTimestamp()
      });
      showToast(`✅ Landlord ${name} created! ID: ${userId}`);
      closeModal('createLandlordModal');
      ['ll_name','ll_email','ll_password','ll_phone'].forEach(id=>document.getElementById(id).value='');
      await loadData();
    } catch(e) {
      err.textContent = '❌ ' + (e.code==='auth/email-already-in-use'?'Email already registered':e.message);
      err.classList.remove('hidden');
    }
    btn.textContent='✅ Create Account'; btn.disabled=false;
  };

  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const tab = link.dataset.tab;
      document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('[id^="tab-"]').forEach(t=>t.classList.add('hidden'));
      document.getElementById('tab-'+tab).classList.remove('hidden');
      document.getElementById('mainNav').classList.remove('open');
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (!confirm('Logout?')) return;
    await signOut(auth);
    window.location.href = '../index.html';
  });
</script>
</body>
</html>
